# Configuração do projeto TaleForge.
# Tudo é opcional: apague o que não precisar, os padrões da engine valem.

[project]
name  = "Meu RPG"
start = "inicio"          # nota inicial (content/inicio.md)

[text]
type_speed = 45           # caracteres por segundo
# instant  = true         # desliga efeitos de digitação (bom para testar)

[theme]
option        = "underline cyan"
menu_selected = "bold cyan"

# Presets chamáveis com [style:perigo] ... [/style]
[styles.perigo]
color = "#f33"
bold  = true
shake = 2

# [audio]
# enabled = true
# driver  = "dummy"       # rode sem placa de som

# Camadas de áudio (opcional). Ative com [layer:nome] ou `layers:` no frontmatter.
# [layers.ambiente]
# volume = 0.6
# sounds = [{ file = "vento.wav", loop = true }]
#
# [layers.criaturas]
# parent = "ambiente"     # sub-camada: herda (multiplica) o volume do pai
# sounds = [{ files = ["coruja.wav"], every = [8, 20], volume = 0.8 }]

[behavior]
on_dead_end = "quit"      # "quit" ou "back"

[dev]
hot_reload = false        # true = recarrega a nota ao salvar
