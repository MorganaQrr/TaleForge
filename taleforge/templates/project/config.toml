[project]
name  = "Meu RPG"
start = "inicio"

[text]
type_speed = 45
# instant  = true          # desliga digitação (testes)

[theme]
option        = "underline cyan"
menu_selected = "bold cyan"

[audio]
enabled = true
buffer  = 1024             # ↑ de 512 se o som estiver picotado
# driver = "dummy"         # sem placa de som

[menu]
allow_back = true

[behavior]
on_dead_end = "quit"       # ou "back"

[dev]
hot_reload  = true

# ── Presets de estilo — use [style:nome] no texto ──
[styles.perigo]
color = "#b6ff3c"
bold  = true
shake = 3

[styles.sussurro]
color = "#4f6b3a"

# ── Camadas de áudio ──
# Ative com `layers: [ambiente, criaturas]` no frontmatter
# ou [layer:ambiente] … [/layer] no corpo

#[layers.ambiente]
#volume = 0.6
#sounds = [
#  { file = "vento.ogg", loop = true },
#  { file = "grilos.ogg", loop = true, volume = 0.4 },
#]
#[layers.criaturas]
#parent = "ambiente"
#sounds = [{ files = ["corvo.ogg", "lobo.ogg"], every = [8, 20], volume = 0.6 }]

# ── Sons de interface ──
[ui_sound]
move   = "ui/move.wav"
select = "ui/select.wav"
volume = 1.0

# ── Vozes de digitação ──
[voice]
enabled = true
default = "padrao"
volume  = 0.5
every   = 2
min_gap = 0.03

# ── Aliases PT (já são padrão) — sobrescreva para customizar ──
[directives]
disabled = []
aliases = { encerrar = "end", brilho = "glow" }

# ── Plugins ──
[plugins]
modules = ["meu_plugin"]